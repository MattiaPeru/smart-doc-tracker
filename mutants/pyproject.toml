[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-doc-tracker"
version = "0.1.0"
description = "Privacy-first local document tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0,<12.0",
    "PyMuPDF>=1.24,<2.0",
    "pytesseract>=0.3.10,<0.4",
    "pydantic>=2.7,<3.0",
    "pymongo>=4.7,<5.0",
    "plyer>=2.1,<3.0",
    "APScheduler>=3.10,<4.0",
    "chromadb-client==1.5.9",
    "fastapi>=0.116,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
mutation = ["mutmut>=3.8,<4.0"]

[project.scripts]
smart-doc-tracker = "smart_doc_tracker.main:run"
smart-doc-tracker-web = "smart_doc_tracker.web.app:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["smart_doc_tracker*"]

[tool.setuptools.package-data]
smart_doc_tracker = [
    "web/templates/*.html",
    "web/static/*.css",
    "web/static/js/*.js",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src/smart_doc_tracker"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "chromadb",
    "chromadb.*",
    "fitz",
    "plyer",
    "pymupdf",
    "pymupdf.*",
    "pytesseract",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/smart_doc_tracker"]
also_copy = ["scripts", "docs/agent"]
# Mutmut's instrumented source cannot match the committed API snapshot.
pytest_add_cli_args_test_selection = [
    "tests",
    "--deselect=tests/scripts/test_generate_agent_reference.py::AgentReferenceGeneratorTests::test_committed_reference_matches_the_current_public_api",
]

[tool.coverage.run]
branch = true
source = ["smart_doc_tracker"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
