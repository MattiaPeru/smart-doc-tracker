[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-doc-tracker"
version = "0.1.0"
description = "Privacy-first local document tracking"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0,<12.0",
    "PyMuPDF>=1.24,<2.0",
    "pytesseract>=0.3.10,<0.4",
    "pydantic>=2.7,<3.0",
    "pymongo>=4.7,<5.0",
    "plyer>=2.1,<3.0",
    "APScheduler>=3.10,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
